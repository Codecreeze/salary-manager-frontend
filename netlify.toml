[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: any path that isn't a real file (e.g. a client-side route like
# /employees/123 hit via direct load or refresh) serves index.html instead of
# Netlify's 404 page, so react-router can take over and resolve the route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
